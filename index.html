<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive Dashboard Web Application"
    >

    <title>Responsive Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Application -->
    <div class="app">

        <!-- Header -->
        <header class="header">
            <h1>Responsive Dashboard</h1>

            <button id="themeToggle">
                🌙 Dark Mode
            </button>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Welcome Section -->
            <section class="welcome-section">
                <h2>Welcome Back 👋</h2>

                <p>
                    Here's an overview of your dashboard.
                </p>
            </section>

            <!-- Dashboard Cards -->
            <section class="dashboard-grid">

                <!-- Card 1 -->
                <article class="dashboard-card">
                    <h3>Total Users</h3>
                    <p class="card-value">1,250</p>
                    <span>+12% this month</span>
                </article>

                <!-- Card 2 -->
                <article class="dashboard-card">
                    <h3>Revenue</h3>
                    <p class="card-value">₹85,400</p>
                    <span>+8% this month</span>
                </article>

                <!-- Card 3 -->
                <article class="dashboard-card">
                    <h3>Orders</h3>
                    <p class="card-value">456</p>
                    <span>+15% this month</span>
                </article>

                <!-- Card 4 -->
                <article class="dashboard-card">
                    <h3>Projects</h3>
                    <p class="card-value">24</p>
                    <span>5 completed</span>
                </article>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
